<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加密波段量化面板</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-text:#006300;
  --accent:#2a78d6; --accent-2:#256abf;
  --human:#7c4dbe; --human-soft:#f1ebfa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --good-text:#0ca30c; --accent:#3987e5; --accent-2:#3987e5;
  --human:#b18cf0; --human-soft:#241c33;
    --human:#b18cf0; --human-soft:#241c33;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --good-text:#0ca30c; --accent:#3987e5; --accent-2:#3987e5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:8px 0 4px}
header.top h1{font-size:22px;margin:0;font-weight:700}
.stamp{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:1px 10px;border:1px solid var(--border);border-radius:999px;
  font-size:12px;color:var(--ink-2);background:var(--surface)}
.tldr{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;margin:14px 0}
.tldr div{padding:3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h2{margin:0 0 4px;font-size:17px}
.price{font-size:26px;font-weight:700}
.chg{font-size:13px;margin-left:6px}
.up{color:var(--good-text)} .down{color:var(--critical)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--grid);margin:6px 0 2px;overflow:hidden}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.meter-marks{position:relative;height:0}
.meter-marks b{position:absolute;top:-12px;width:1px;height:14px;background:var(--baseline)}
.tfrow{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:13px;color:var(--ink-2)}
.tfrow .tf{width:36px;font-weight:600;color:var(--ink)}
.tfrow .score{width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.tfrow .sig{font-size:12px}
.lamp{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;
  border:1px solid var(--border)}
.lamp i{width:8px;height:8px;border-radius:50%;display:inline-block}
.levels{font-size:13px;color:var(--ink-2);margin-top:10px;border-top:1px solid var(--grid);padding-top:8px}
.levels b{color:var(--ink);font-variant-numeric:tabular-nums}
.levels .lab{color:var(--muted);font-size:12px}
details.comp{margin-top:8px;font-size:13px}
details.comp summary{cursor:pointer;color:var(--accent);font-size:13px}
table.comp{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px}
table.comp td,table.comp th{padding:3px 6px;border-bottom:1px solid var(--grid);text-align:left}
table.comp td:nth-child(2){text-align:right;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.kv .k{color:var(--ink-2)} .kv .v{font-variant-numeric:tabular-nums;font-weight:600}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
/* 关键位速查 */
.keylv{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;margin-top:14px}
.keylv h2{margin:0 0 2px;font-size:17px}
.keylv .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
table.klv{width:100%;min-width:620px;border-collapse:collapse;font-size:13px}
table.klv th,table.klv td{padding:6px 8px;border-bottom:1px solid var(--grid);
  text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.klv th{color:var(--ink-2);font-weight:600;text-align:right;font-size:12px}
table.klv th:first-child,table.klv td:first-child{text-align:left}
table.klv tbody tr:last-child td{border-bottom:none}
table.klv .coin{font-weight:700}
table.klv .dist{color:var(--muted);font-size:11px;display:block;font-weight:400}
/* AI 层运行状态——失败要在产品界面可见，不能只躺在 CI 日志里 */
.aistat{margin-top:14px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6;
  border:1px solid var(--border);background:var(--surface)}
.aistat.warn{border-color:var(--warning)}
.aistat.err{border-color:var(--critical)}
.aistat b{font-weight:700}
.aistat .sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
/* 做多方案（主观层）——来自 AI 分析，与机械计算显著区分 */
.hplan{margin-top:10px;border:1px solid var(--human);border-radius:10px;overflow:hidden}
.hplan>summary{list-style:none;cursor:pointer;padding:10px 12px;background:var(--human-soft);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hplan>summary::-webkit-details-marker{display:none}
.hplan .tag-ai{font-size:11px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--human);color:var(--human);white-space:nowrap;font-weight:600}
.hplan .body{padding:10px 12px}
.hplan.void{opacity:.62}
.bar{padding:7px 12px;font-size:12.5px;line-height:1.5}
.bar.warn{background:color-mix(in srgb,var(--warning) 18%,transparent);
  border-bottom:1px solid var(--border)}
.bar.void{background:color-mix(in srgb,var(--critical) 15%,transparent);
  border-bottom:1px solid var(--border);color:var(--critical);font-weight:600}
@supports not (background:color-mix(in srgb,red 5%,transparent)){
  .bar.warn{background:var(--grid)} .bar.void{background:var(--grid)}
}
.prow{display:flex;justify-content:space-between;gap:10px;padding:4px 0;
  border-bottom:1px solid var(--grid);font-size:13px}
.prow:last-child{border-bottom:none}
.prow .pk{color:var(--ink-2);flex:1 1 auto}
.prow .pv{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.prow .sub{display:block;color:var(--muted);font-size:11px;font-weight:400}
.sec-t{font-size:12px;font-weight:700;color:var(--ink-2);margin:10px 0 2px}
.sec-t:first-child{margin-top:0}
.mech-fold{margin-top:8px}
.mech-fold>summary{cursor:pointer;font-size:12px;color:var(--muted);padding:2px 0}
/* 做多方案（机械层）——与机械计算区块视觉区分 */
.pbk{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);
  background:var(--grid);border-radius:0 8px 8px 0}
@supports (background:color-mix(in srgb,red 5%,transparent)){
  .pbk{background:color-mix(in srgb,var(--accent) 6%,transparent)}
}
.pbk .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pbk .tag{font-size:11px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
.pbk .conf{font-weight:700}
.zone{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px}
.zone .zn{color:var(--ink-2)} .zone .zv{font-variant-numeric:tabular-nums;font-weight:600}
.pbk ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2)}
.pbk ul li{padding:1px 0}
h2.sec{font-size:17px;margin:26px 0 2px}
.reports{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 16px;margin-top:10px}
.reports a{color:var(--accent);text-decoration:none;display:inline-block;padding:4px 10px 4px 0}
.reports a:hover{text-decoration:underline}
#reportview{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:20px 24px;margin-top:14px;display:none;overflow-x:auto}
#reportview table{border-collapse:collapse;font-size:13.5px}
#reportview th,#reportview td{border:1px solid var(--grid);padding:4px 9px}
#reportview h1{font-size:20px} #reportview h2{font-size:17px} #reportview h3{font-size:15px}
#reportview blockquote{border-left:3px solid var(--baseline);margin:8px 0;padding:2px 12px;color:var(--ink-2)}
footer{margin-top:34px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--grid);padding-top:14px}
.err{color:var(--critical);padding:20px 0}
.missing{color:var(--serious);font-size:12.5px}
@media (max-width:640px){ .wrap{padding:12px 10px 40px} .price{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>加密波段量化面板</h1>
    <span class="pill">BTC · ETH · SOL</span>
    <span class="stamp" id="stamp">加载中…</span>
  </header>
  <div class="stamp">纯量化脚本每日自动生成 · 加权评分 SRSI25/MACD25/MFI20/Vol15/ST15 · ≥70 做多 / ≤30 离场</div>

  <div class="tldr" id="tldr" hidden></div>
  <div id="aistatus"></div>
  <div id="keylevels"></div>
  <div class="grid" id="coins"></div>
  <div class="grid" id="aux"></div>

  <h2 class="sec">历史报告</h2>
  <div class="reports" id="history">加载中…</div>
  <div id="reportview"></div>

  <footer id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const TF = {"4h":"4H","1d":"日线","1w":"周线","1M":"月线"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fp = p => p==null ? "—" : (p>=1000 ? p.toLocaleString("en-US",{maximumFractionDigits:0}) : p.toLocaleString("en-US",{maximumFractionDigits:2}));

function lampColor(sig){
  return sig==="做多信号" ? "var(--good)" : sig==="离场信号" ? "var(--critical)" : "var(--warning)";
}
function lamp(sig){
  return `<span class="lamp"><i style="background:${lampColor(sig)}"></i>${esc(sig||"—")}</span>`;
}
function meter(score, sig){
  const w = Math.max(0, Math.min(100, score||0));
  return `<div class="meter"><i style="width:${w}%;background:${lampColor(sig)}"></i></div>
  <div class="meter-marks"><b style="left:30%"></b><b style="left:70%"></b></div>`;
}
function chg(v){
  if(v==null) return "";
  const cls = v>=0 ? "up" : "down";
  return `<span class="chg ${cls}">${v>=0?"+":""}${v.toFixed(2)}%</span>`;
}
function levelsHtml(lv){
  if(!lv) return "";
  const row = (name, arr) => arr && arr.length
    ? `<div>${name}：` + arr.map(x=>`<b>${fp(x.price)}</b> <span class="lab">${esc(x.basis)}</span>`).join("　") + `</div>` : "";
  return row("阻力", lv.resistances) + row("支撑", lv.supports);
}
function compTable(sc){
  if(!sc) return "";
  const rows = [
    ["SRSI", sc.srsi, `K=${sc.srsi.k??"—"} D=${sc.srsi.d??"—"}`],
    ["MACD", sc.macd, `柱 ${sc.macd.hist??"—"}`],
    ["MFI", sc.mfi, sc.mfi.value!=null?`MFI ${sc.mfi.value}`:(sc.mfi.note||"—")],
    ["Volume", sc.volume, sc.volume.ratio_vs_ma20!=null?`量/20均量 ${sc.volume.ratio_vs_ma20}`:"—"],
    ["SuperTrend", sc.supertrend, `${sc.supertrend.direction} @ ${fp(sc.supertrend.line)}`],
  ];
  return `<details class="comp"><summary>4H 评分明细（ADX ${sc.adx?.value??"—"} · ${esc(sc.adx?.trend_strength||"")}）</summary>
  <table class="comp">` + rows.map(([n,o,note])=>
    `<tr><td>${n}</td><td>${o.score}/${o.max}</td><td>${esc(note)}</td></tr>`).join("") +
  `</table></details>`;
}
function planSection(coin, cd, pb){
  const human = humanPlanHtml(coin, pb, cd.price ?? cd.frames?.["4h"]?.close);
  const mech = playbookHtml(cd.playbook);
  if(!human) return mech;
  const st = planStatus(pb, coin, cd.price ?? cd.frames?.["4h"]?.close);
  // 主观层作废时把机械层摊开当兜底，否则收进折叠避免两套方案抢注意力
  if(st && st.level === "void") return human + mech;
  return human + (mech ? `<details class="mech-fold"><summary>机械版方案（规则派生，兜底参考）</summary>${mech}</details>` : "");
}
function coinCard(name, cd, pb){
  const f4 = cd.frames?.["4h"], sc4 = f4?.score;
  let tfrows = "";
  for(const tf of ["4h","1d","1w","1M"]){
    const fr = cd.frames?.[tf];
    if(!fr){ tfrows += `<div class="tfrow"><span class="tf">${TF[tf]}</span><span class="missing">数据缺失</span></div>`; continue; }
    const s = fr.score;
    tfrows += `<div class="tfrow"><span class="tf">${TF[tf]}</span>
      <span style="flex:1">${meter(s.total, s.signal)}</span>
      <span class="score">${s.total}</span>${lamp(s.signal)}</div>`;
  }
  return `<div class="card">
    <h2>${name}</h2>
    <div><span class="price">$${fp(cd.price)}</span>${chg(cd.spot?.change_24h_pct)}
      ${cd.change_5d_pct!=null?`<span class="chg ${cd.change_5d_pct>=0?"up":"down"}">5日 ${cd.change_5d_pct>=0?"+":""}${cd.change_5d_pct}%</span>`:""}</div>
    ${tfrows}
    ${compTable(sc4)}
    <div class="levels">${levelsHtml(f4?.levels)}</div>
    ${geometryHtml(cd.geometry)}
    ${planSection(name, cd, pb)}
  </div>`;
}
// AI 层状态：区分「今天没更新」和「今天没跑成」——后者用户有权知道
const AI_STATUS_TEXT = {
  auth_failed:       ["err",  "API 认证失败"],
  permission_denied: ["err",  "API 权限不足"],
  bad_request:       ["err",  "请求无效（代码问题）"],
  budget_exceeded:   ["err",  "已达月度支出上限"],
  config_error:      ["err",  "配置错误"],
  rate_limited:      ["warn", "API 限流或额度耗尽"],
  connection_error:  ["warn", "网络故障"],
  api_error:         ["warn", "API 返回错误"],
  temp_failure:      ["warn", "临时故障"],
  invalid_output:    ["warn", "输出未通过契约校验"],
  refused:           ["warn", "模型拒绝了本次请求"],
};
function aiStatusHtml(st, pb){
  // ok 与 skipped_no_key 都不打扰：前者正常，后者是尚未配置的预期状态
  if(!st || st.status === "ok" || st.status === "skipped_no_key") return "";
  const [cls, label] = AI_STATUS_TEXT[st.status] || ["warn", "运行失败"];
  const when = st.last_attempt_utc ? new Date(st.last_attempt_utc) : null;
  const whenTxt = when && !isNaN(when)
    ? when.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})
    : "";
  let tail = "";
  if(pb?.generated_at_utc){
    const g = new Date(pb.generated_at_utc);
    if(!isNaN(g)){
      const days = Math.floor((Date.now()-g.getTime())/864e5);
      // 方案还是当天的就不必强调「仍是」——那不算旧，只是这次没跑成
      tail = days >= 1
        ? `当前显示的仍是 ${days} 天前（${g.toLocaleDateString("zh-CN",{timeZone:"Asia/Shanghai"})}）的方案`
        : "机械层不受影响，AI 方案维持上一次的结果";
    }
  } else {
    tail = "尚无可用的 AI 方案，页面仅显示机械层结果";
  }
  return `<div class="aistat ${cls}">${cls==="err"?"⛔":"⚠️"}
    <b>AI 分析层：${esc(label)}</b>${whenTxt?` · ${esc(whenTxt)}`:""}
    <span class="sub">${esc(st.detail||"")}${tail?" ｜ "+esc(tail):""}</span></div>`;
}
function keyLevelsCard(d){
  const TFS = [["4h","4H"],["1d","日线"]];
  const rows = ["BTC","ETH","SOL"].map(coin=>{
    const cd = d.coins?.[coin]; if(!cd) return "";
    const price = cd.price;
    // 距离基准必须与支撑阻力同源（该周期收盘价），不能用另一来源的现货价，
    // 否则两者不一致时会算出自相矛盾的百分比。
    const cell = (tf, lv, pick) => {
      const arr = (lv?.[pick==="s"?"supports":"resistances"])||[];
      if(!arr.length) return `<td class="dim">—</td>`;
      const ref = cd.frames?.[tf]?.close ?? price;
      const x = pick==="s"
        ? arr.reduce((a,b)=>b.price>a.price?b:a)      // 最贴近参考价的支撑
        : arr.reduce((a,b)=>b.price<a.price?b:a);     // 最贴近参考价的阻力
      const pct = ref ? ((x.price/ref-1)*100) : null;
      const cls = pick==="s" ? "down" : "up";
      return `<td><span class="${cls}">$${fp(x.price)}</span>
        <span class="dist">${esc(x.basis||"")}${pct!=null?` · ${pct>=0?"+":""}${pct.toFixed(1)}%`:""}</span></td>`;
    };
    let tds = `<td class="coin">${coin}</td><td>$${fp(price)}</td>`;
    for(const [tf] of TFS){
      const lv = cd.frames?.[tf]?.levels;
      tds += cell(tf,lv,"s") + cell(tf,lv,"r");
    }
    const kp = cd.key_pivots||{};
    for(const [key,cls] of [["flip_long","up"],["structural_line","down"]]){
      const v = kp[key];
      tds += v
        ? `<td><span class="${cls}"><b>$${fp(v.price)}</b></span>
             <span class="dist">${esc(v.basis||"")}${v.distance_pct!=null?` · ${v.distance_pct>=0?"+":""}${v.distance_pct}%`:""}</span></td>`
        : `<td>—</td>`;
    }
    return `<tr>${tds}</tr>`;
  }).filter(Boolean).join("");
  if(!rows) return "";
  const head = TFS.map(([,label])=>`<th>${label}支撑</th><th>${label}阻力</th>`).join("")
    + `<th>🎯 关键翻多线</th><th>⛔ 结构生死线</th>`;
  return `<div class="keylv"><h2>关键位速查</h2>
    <div class="note" style="margin-top:2px">前四列为该周期最贴近的支撑/阻力，括注依据与距<b>该周期收盘价</b>的百分比（与点位同源，故可能与现价列略有出入）。<b>关键翻多线</b>＝上方最近的周线级关键位，站上即中期结构转多；<b>结构生死线</b>＝下方最低的周线级防线，跌破即中期论点证伪。</div>
    <div class="scroller"><table class="klv">
      <thead><tr><th>币种</th><th>现价</th>${head}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}
// ---- 主观层（AI 分析方案）----
// 时效判定：三条线，从重到轻。止损被击穿最严重——方案的前提已经不成立。
const DRIFT_WARN_PCT = 5;      // 价格偏离锚定价超过此值 → 提示重新评估
const AGE_WARN_HOURS = 48;     // 生成时间超过此值 → 提示可能过期

function planStatus(pb, coin, price){
  const out = {level:"fresh", msgs:[]};
  if(!pb) return null;
  const cp = pb.coins?.[coin];
  if(!cp) return null;

  const anchor = pb.price_anchor?.[coin];
  const ts = pb.generated_at_utc ? new Date(pb.generated_at_utc) : null;
  const ageH = ts && !isNaN(ts) ? (Date.now()-ts.getTime())/36e5 : null;

  // 1) 最终止损被击穿 —— 方案作废
  const stops = (cp.stops||[]).filter(x=>typeof x.price==="number");
  const finalStop = stops.length ? stops.reduce((a,b)=>(b.level??0)>(a.level??0)?b:a) : null;
  if(finalStop && price != null && price < finalStop.price){
    out.level = "void";
    out.msgs.push(`现价已跌破${esc(finalStop.name)} $${fp(finalStop.price)}——方案前提不再成立，勿按此执行`);
  }

  // 2) 价格走离锚定价
  if(anchor && price != null){
    const drift = (price/anchor-1)*100;
    if(Math.abs(drift) >= DRIFT_WARN_PCT){
      if(out.level==="fresh") out.level = "stale";
      out.msgs.push(`价格较方案锚定价 $${fp(anchor)} 已${drift>=0?"上行":"下行"} ${Math.abs(drift).toFixed(1)}%，点位需重新评估`);
    }
  }

  // 3) 时间过久
  if(ageH != null && ageH >= AGE_WARN_HOURS){
    if(out.level==="fresh") out.level = "stale";
    out.msgs.push(`方案生成于 ${Math.floor(ageH)} 小时前`);
  }
  if(ageH != null) out.ageH = ageH;
  return out;
}

function planRows(items, render){
  return (items||[]).map(render).join("");
}

function humanPlanHtml(coin, pb, price){
  const st = planStatus(pb, coin, price);
  if(!st) return "";
  const cp = pb.coins[coin];
  const when = pb.generated_at_utc ? new Date(pb.generated_at_utc) : null;
  const whenTxt = when && !isNaN(when)
    ? when.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})
    : (pb.report_date||"");

  const bars = st.msgs.map(m=>
    `<div class="bar ${st.level==="void"?"void":"warn"}">${st.level==="void"?"⛔ ":"⚠️ "}${m}</div>`).join("");

  let body = "";
  const conf = `信心 ${esc(cp.confidence||"")}`;
  if(cp.confidence_reason)
    body += `<div class="note" style="margin:0 0 8px">${esc(cp.confidence_reason)}</div>`;

  if(cp.entry_batches?.length){
    body += `<div class="sec-t">分批入场</div>` + planRows(cp.entry_batches, b=>
      `<div class="prow"><span class="pk">第 ${b.batch} 批 ${b.ideal?'<b style="color:var(--human)">· 理想加仓位</b>':""}
        <span class="sub">${esc(b.basis||"")}</span></span>
        <span class="pv">$${fp(b.low)} – $${fp(b.high)}<span class="sub">${b.weight_pct}% 计划仓</span></span></div>`);
  }
  if(cp.breakout_entry){
    body += `<div class="sec-t">突破式入场（替代方案）</div>
      <div class="prow"><span class="pk">${esc(cp.breakout_entry.condition||"")}
        <span class="sub">${esc(cp.breakout_entry.note||"")}</span></span></div>`;
  }
  if(cp.stops?.length){
    body += `<div class="sec-t">多层止损</div>` + planRows(cp.stops, x=>
      `<div class="prow"><span class="pk">${esc(x.name||"")}
        <span class="sub">${esc(x.trigger||"")}${x.basis?` · ${esc(x.basis)}`:""}</span></span>
        <span class="pv down">$${fp(x.price)}<span class="sub">${esc(x.action||"")}</span></span></div>`);
  }
  if(cp.targets?.length){
    body += `<div class="sec-t">分批止盈</div>` + planRows(cp.targets, t=>
      `<div class="prow"><span class="pk">${esc(t.name||"")}
        <span class="sub">${esc(t.basis||"")}${t.note?` · ${esc(t.note)}`:""}</span></span>
        <span class="pv up">$${fp(t.price)}<span class="sub">减 ${t.reduce_pct}%</span></span></div>`);
    if(cp.trailing)
      body += `<div class="prow"><span class="pk">剩余转移动止盈<span class="sub">${esc(cp.trailing.note||"")}</span></span>
        <span class="pv">${cp.trailing.remain_pct}%</span></div>`;
  }
  if(cp.risk_reward?.length){
    body += `<div class="sec-t">风险回报比</div>` + planRows(cp.risk_reward, r=>{
      const mark = r.verdict==="optimal" ? ' <b style="color:var(--good-text)">← 最优执行</b>'
                 : r.verdict==="not_recommended" ? ' <b class="down">← 不推荐</b>' : "";
      return `<div class="prow"><span class="pk">${esc(r.label||"")}${mark}
        <span class="sub">入场 $${fp(r.entry)} / 止损 $${fp(r.stop)} / 目标 $${fp(r.target)}</span></span>
        <span class="pv">${r.ratio} : 1</span></div>`;
    });
    if(cp.rr_note) body += `<div class="note">${esc(cp.rr_note)}</div>`;
  }
  body += `<div class="sec-t">仓位权重</div>
    <div class="prow"><span class="pk">${esc(cp.position_note||"占加密波段总仓")}</span>
      <span class="pv">${cp.position_pct}%</span></div>`;

  const ac = pb.add_conditions;
  if(ac?.items?.length){
    body += `<div class="sec-t">加仓硬条件（${esc(ac.require||"")}）<span style="font-weight:400;color:var(--muted)"> ${esc(ac.goal||"")}</span></div><ul>`;
    for(const it of ac.items)
      body += `<li>${esc(it.condition)}${it.note?` <span style="color:var(--muted)">— ${esc(it.note)}</span>`:""}</li>`;
    body += `</ul>`;
    if(ac.partial_note) body += `<div class="note">${esc(ac.partial_note)}</div>`;
  }

  return `<details class="hplan ${st.level==="void"?"void":""}" ${st.level==="void"?"":"open"}>
    <summary><span class="tag-ai">AI 分析方案</span>
      <b>${esc(cp.bias||"")}${cp.bias_note?`（${esc(cp.bias_note)}）`:""}</b>
      <span>${conf}</span>
      <span class="lab" style="margin-left:auto;color:var(--muted);font-weight:400">${esc(whenTxt)}</span>
    </summary>
    ${bars}<div class="body">${body}</div></details>`;
}
function playbookHtml(pb){
  if(!pb || !pb.confidence) return "";
  const c = pb.confidence, pos = pb.position||{};
  let html = `<div class="pbk"><div class="hd">
    <span class="tag">机械版 · 规则派生</span>
    <span class="conf">信心 ${esc(c.level)}</span>
    <span class="lab" style="color:var(--muted);font-weight:400">综合分 ${c.score}</span>
    ${pos.pct!=null?`<span class="conf" style="margin-left:auto">仓位 ${pos.pct}%</span>`:""}
  </div>`;
  html += `<div class="note" style="margin:0 0 6px">${esc(c.basis||"")}</div>`;
  for(const z of (pb.entry_zones||[])){
    html += `<div class="zone"><span class="zn">${esc(z.name)}
      <span class="dist" style="display:block;color:var(--muted);font-size:11px">${esc(z.note||"")}</span></span>
      <span class="zv">$${fp(z.low)} – $${fp(z.high)}</span></div>`;
  }
  if(pb.invalidation){
    html += `<div class="zone"><span class="zn">方案失效价<span class="dist" style="display:block;color:var(--muted);font-size:11px">${esc(pb.invalidation.basis||"")}</span></span>
      <span class="zv down">$${fp(pb.invalidation.price)}</span></div>`;
  }
  if(pb.structural_anchor){
    const a = pb.structural_anchor;
    html += `<div class="zone"><span class="zn">${esc(a.name)}</span>
      <span class="zv">$${fp(a.price)}${a.ratio!=null?` <span class="dist" style="display:inline">×${a.ratio}</span>`:""}</span></div>`;
  }
  const ac = pb.add_conditions;
  if(ac?.items?.length){
    html += `<div class="lab" style="margin-top:8px;font-size:12px">加仓硬条件（${esc(ac.require)}）</div><ul>`;
    for(const it of ac.items){
      html += `<li>${esc(it.condition)}${it.gap?` — <span style="color:var(--muted)">${esc(it.gap)}</span>`:""}</li>`;
    }
    html += `</ul>`;
  }
  for(const n of (pb.notes||[])) html += `<div class="missing">${esc(n)}</div>`;
  html += `<div class="note">规则派生的参考值，非主观建议；本工具不判断是否应当入场。</div></div>`;
  return html;
}
function geometryHtml(g){
  if(!g || (!g.stops?.length && !g.targets?.length)) return "";
  const li = [];
  for(const st of (g.stops||[])){
    li.push(`<div class="kv"><span class="k">${esc(st.name)}</span><span class="v down">$${fp(st.price)}
      <span class="lab" style="font-weight:400;color:var(--muted)"> ${esc(st.basis||"")}${st.distance_pct!=null?` · ${st.distance_pct}%`:""}</span></span></div>`);
  }
  for(const t of (g.targets||[])){
    li.push(`<div class="kv"><span class="k">${esc(t.name)} <span class="lab" style="color:var(--muted);font-weight:400">${esc(t.plan||"")}</span></span>
      <span class="v up">$${fp(t.price)}<span class="lab" style="font-weight:400;color:var(--muted)"> ${esc(t.basis||"")}${t.distance_pct!=null?` · +${t.distance_pct}%`:""}</span></span></div>`);
  }
  const rr = g.rr||{};
  const rrKeys = Object.keys(rr);
  const rrLine = rrKeys.length
    ? `<div class="kv"><span class="k">风险回报比</span><span class="v">${rrKeys.map(k=>`${esc(k)} ${rr[k]}:1`).join("　")}</span></div>` : "";
  const notes = (g.notes||[]).map(n=>`<div class="missing">${esc(n)}</div>`).join("");
  return `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--grid)">
    <div class="lab" style="margin-bottom:6px">交易几何 <span style="color:var(--muted);font-weight:400">· 纯计算，非入场建议</span></div>
    ${li.join("")}${rrLine}${notes}
    <div class="note">以现价为参考入场点推导；本工具不判断是否应当入场</div></div>`;
}
function conditionsCard(tc){
  if(!tc || (!tc.offense?.length && !tc.defense?.length)) return "";
  const block = (items, title) => {
    if(!items?.length) return "";
    const rows = items.map(c => `<div class="kv" style="align-items:flex-start">
      <span class="k" style="max-width:58%">${c.met?"✅":"○"} ${esc(c.condition)}</span>
      <span class="v" style="font-weight:400;text-align:right">${esc(c.current||"")}
        ${c.gap?`<span class="lab" style="display:block;color:var(--muted);font-weight:400">${esc(c.gap)}</span>`:""}</span></div>`).join("");
    return `<div class="lab" style="margin:10px 0 4px">${title}</div>${rows}`;
  };
  return `<div class="card"><h2>触发阈值 <span class="lab" style="color:var(--muted);font-weight:400">盯这些才改变决策</span></h2>
    ${block(tc.offense, "🟢 转进攻条件")}${block(tc.defense, "🔴 转防御条件")}</div>`;
}
function cycleCard(d){
  const c = d.btc_cycle||{}, fg = d.macro?.fear_greed;
  let rows = "";
  if(c.ma200w) rows += `<div class="kv"><span class="k">BTC 200周均线</span><span class="v">$${fp(c.ma200w)}（价格/均线 ${c.price_over_ma200w}）</span></div>`;
  if(c.power_law) rows += `<div class="kv"><span class="k">幂律走廊位置</span><span class="v">${c.power_law.position_pct}%（下轨 $${fp(c.power_law.support)}）</span></div>`;
  if(c.mvrv){
    const mv = c.mvrv;
    const extra = [];
    if(mv.percentile!=null) extra.push(`分位 ${mv.percentile}%`);
    if(mv.zscore!=null) extra.push(`Z=${mv.zscore}`);
    if(mv.zscore==null && mv.zscore_note) extra.push("Z-Score 不可用");
    if(mv.degraded) extra.push("降级：仅读数");
    rows += `<div class="kv"><span class="k">MVRV</span><span class="v">${mv.value}
      <span class="lab" style="font-weight:400;color:var(--muted)">${extra.length?" "+esc(extra.join(" · ")):""} ${mv.date||""}</span></span></div>`;
  }
  if(c.cbbi){
    const cb = c.cbbi;
    const hot = cb.value>=90, cold = cb.value<15;
    const chg = cb.change_30d!=null ? `<span class="lab" style="font-weight:400;color:var(--muted)"> 30日 ${cb.change_30d>=0?"+":""}${cb.change_30d}</span>` : "";
    rows += `<div class="kv"><span class="k">CBBI</span><span class="v ${hot?"down":(cold?"up":"")}">${cb.value}${chg}
      <span class="lab" style="font-weight:400;color:var(--muted)"> ${esc(cb.zone||"")}</span></span></div>`;
  }
  if(fg) rows += `<div class="kv"><span class="k">恐惧贪婪指数</span><span class="v">${fg.value} · ${esc(fg.label)}</span></div>`;
  if(!rows) rows = `<div class="missing">周期数据缺失</div>`;
  return `<div class="card"><h2>BTC 周期估值锚</h2>${rows}
    <div class="note">幂律为公开近似拟合，仅作周期定位参考</div></div>`;
}
function macroCard(d){
  const idx = d.macro?.indices, rg = d.macro?.regime, etf = d.macro?.etf_flows;
  let rows = "";
  if(idx){
    for(const [key,label] of [["SP500","标普500"],["NASDAQ","纳指"],["DOW","道指"]]){
      const v = idx[key]; if(!v) continue;
      rows += `<div class="kv"><span class="k">${label}</span><span class="v">${v.last.toLocaleString()} <span class="${v.change_1d_pct>=0?"up":"down"}">${v.change_1d_pct>=0?"+":""}${v.change_1d_pct}%</span>
        <span class="lab" style="color:var(--muted);font-weight:400">5日 ${v.change_5d_pct>=0?"+":""}${v.change_5d_pct}%</span></span></div>`;
    }
  } else rows += `<div class="missing">美股数据缺失</div>`;
  if(etf?.BTC?.length){
    const last = etf.BTC[etf.BTC.length-1];
    rows += `<div class="kv"><span class="k">BTC ETF 最新净流向</span><span class="v ${last.total_musd>=0?"up":"down"}">${last.total_musd>=0?"+":""}${last.total_musd.toLocaleString()}M</span></div>`;
  } else rows += `<div class="kv"><span class="k">BTC ETF 流向</span><span class="missing">抓取失败，见 farside.co.uk</span></div>`;
  let regime = "";
  if(rg) regime = `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--grid)">
    <div><b>行情性质（规则判定）</b>：${esc(rg.name||"")}</div>
    <div class="note">${esc(rg.meaning||"")}<br>机械应对：${esc(rg.action||"")}${rg.etf_note?`<br>${esc(rg.etf_note)}`:""}</div></div>`;
  return `<div class="card"><h2>美股与风险偏好</h2>${rows}${regime}</div>`;
}

async function showReport(date){
  const view = $("#reportview");
  view.style.display = "block";
  view.innerHTML = "加载中…";
  try{
    const md = await (await fetch(`reports/${date}.md`)).text();
    view.innerHTML = (window.marked ? marked.parse(md) : `<pre style="white-space:pre-wrap">${esc(md)}</pre>`);
    view.scrollIntoView({behavior:"smooth"});
  }catch(e){ view.innerHTML = `<div class="err">报告加载失败：${esc(e)}</div>`; }
}

async function main(){
  let d;
  try{
    d = await (await fetch("data/latest.json", {cache:"no-store"})).json();
  }catch(e){
    $("#stamp").textContent = "";
    $("#coins").innerHTML = `<div class="err">尚无数据——等待第一次定时任务运行（GitHub Actions）。</div>`;
    return;
  }
  $("#stamp").textContent = d.generated_at_beijing || d.date;
  // TL;DR
  const btc4 = d.coins?.BTC?.frames?.["4h"]?.score;
  const tl = [];
  if(btc4) tl.push(`BTC 4H 加权评分 <b>${btc4.total}/100</b> ${lamp(btc4.signal)}`);
  if(d.macro?.regime) tl.push(`行情性质：<b>${esc(d.macro.regime.name)}</b> —— ${esc(d.macro.regime.action)}`);
  if(d.macro?.regime?.etf_note) tl.push(esc(d.macro.regime.etf_note));
  if(tl.length){ $("#tldr").hidden = false; $("#tldr").innerHTML = tl.map(x=>`<div>${x}</div>`).join(""); }
  // coins
  // 主观层与其运行状态：独立文件，缺失或损坏都不影响机械层渲染
  const loadJSON = async (p) => {
    try{ const r = await fetch(p, {cache:"no-store"}); return r.ok ? await r.json() : null; }
    catch(e){ return null; }
  };
  const [pb, aiStatus] = await Promise.all([
    loadJSON("data/playbook.json"),
    loadJSON("data/ai-status.json"),
  ]);
  $("#aistatus").innerHTML = aiStatusHtml(aiStatus, pb);

  $("#keylevels").innerHTML = keyLevelsCard(d);
  $("#coins").innerHTML = ["BTC","ETH","SOL"].map(c => d.coins?.[c] ? coinCard(c, d.coins[c], pb) : "").join("");
  $("#aux").innerHTML = cycleCard(d) + macroCard(d) + conditionsCard(d.trigger_conditions);
  // footer
  $("#foot").innerHTML = esc(d.disclaimer||"") +
    (d.missing?.length ? `<div class="missing" style="margin-top:8px">本次缺失：${esc(d.missing.join("；"))}</div>` : "");
  // history
  try{
    const idx = await (await fetch("data/index.json", {cache:"no-store"})).json();
    const dates = (idx.dates||[]).slice().reverse();
    $("#history").innerHTML = dates.length
      ? dates.map(x=>`<a href="#" onclick="showReport('${x}');return false">${x}</a>`).join("")
      : "暂无历史报告";
  }catch(e){ $("#history").textContent = "历史索引加载失败"; }
}
main();
</script>
