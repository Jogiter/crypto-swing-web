name: Daily Crypto Swing Analysis

on:
  schedule:
    # 00:15 UTC = 北京时间 08:15，每天一次
    - cron: "15 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt lxml

      - name: Run tests
        # 纯逻辑测试，不触网；失败即阻断，避免用坏掉的计算生成报告
        run: python -m pytest tests/ -q

      - name: Run analysis
        run: python run_analysis.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "analysis: $(date -u +%Y-%m-%d) auto report"
            git push
          fi
